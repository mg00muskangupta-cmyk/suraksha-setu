name: Build check
on:
  push:
    branches: [main, round-3-upgrades]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show runtime
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
